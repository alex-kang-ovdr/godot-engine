<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Godot 4.7.2 Web Editor Canvas</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;padding:0;background:#12151b;overflow:hidden}
    #editor-canvas{display:block;width:100%;height:100%;outline:none;background:#12151b}
  </style>
</head>
<body>
  <canvas id="editor-canvas" tabindex="0"></canvas>
  <script src="/vendor/godot.editor.js"></script>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('editor-canvas');
      function post(type, data) {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ source: 'animation-studio-godot', type, ...data }, window.location.origin);
          }
        } catch (_) {}
      }

      async function boot() {
        try {
          if (!window.crossOriginIsolated) {
            throw new Error('Cross-Origin Isolation(COOP/COEP)이 비활성화되어 Godot Web Editor 스레드를 시작할 수 없습니다.');
          }
          if (!Engine.isWebGLAvailable()) {
            throw new Error('이 브라우저는 WebGL2를 지원하지 않습니다.');
          }
          const missing = Engine.getMissingFeatures({ threads: true });
          if (missing.length) {
            throw new Error('Godot Web Editor 필수 기능 누락: ' + missing.join(', '));
          }

          post('progress', { title: '프로젝트 에셋 목록 조회 중…', detail: '3D 아레나 씬 및 28종 네이티브 GLB/RES 확인 중', pct: 8 });
          const manifestRes = await fetch('/api/project-manifest', { cache: 'no-store' });
          const manifest = await manifestRes.json();
          if (!manifestRes.ok || !manifest.ok) throw new Error('프로젝트 매니페스트 조회 실패');

          post('progress', { title: '프로젝트 파일 다운로드 중…', detail: `0 / ${manifest.files.length}개 파일 수신 중`, pct: 12 });
          const fetched = [];
          let loadedBytes = 0;
          const totalBytes = Math.max(1, manifest.totalBytes);
          const batchSize = 6;
          for (let i = 0; i < manifest.files.length; i += batchSize) {
            const slice = manifest.files.slice(i, i + batchSize);
            const results = await Promise.all(slice.map(async (f) => {
              const r = await fetch('/project/' + f.path.split('/').map(encodeURIComponent).join('/'));
              if (!r.ok) throw new Error(`파일 다운로드 실패: ${f.path} (${r.status})`);
              const buf = new Uint8Array(await r.arrayBuffer());
              loadedBytes += buf.byteLength;
              return { path: f.path, buf };
            }));
            fetched.push(...results);
            const ratio = Math.min(1, loadedBytes / totalBytes);
            post('progress', {
              title: null,
              detail: `${fetched.length}/${manifest.files.length}개 파일 (${(loadedBytes / 1048576).toFixed(1)} MB)`,
              pct: 12 + ratio * 24,
            });
          }

          post('progress', { title: 'Godot 4.7.2 웹 에디터 WASM 로딩 중…', detail: '엔진 바이너리 수신 중 (브라우저 캐시 적용)', pct: 38 });
          const concurrency = Math.min(16, Math.max(6, navigator.hardwareConcurrency || 4));
          const engine = new Engine({
            canvas,
            canvasResizePolicy: 2,
            unloadAfterInit: false,
            emscriptenPoolSize: concurrency,
            godotPoolSize: Math.max(2, Math.floor(concurrency / 3)),
            onProgress: (current, total) => {
              if (total > 0) {
                const ratio = Math.min(1, current / total);
                post('progress', {
                  title: null,
                  detail: `WASM ${(current / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB`,
                  pct: 38 + ratio * 48,
                });
              }
            },
            onPrint: (...args) => {
              const line = args.join(' ');
              post('log', { line });
              if (line.includes('ANIMATION_STUDIO_EDITOR_READY')) {
                post('addon_ready', { line });
              }
            },
            onPrintError: (...args) => {
              const line = args.join(' ');
              post('log_error', { line, isScriptError: /SCRIPT ERROR:|Parse Error:/.test(line) });
            },
          });

          await engine.init('/vendor/godot.editor');
          post('progress', { title: '가상 파일시스템 마운트 중…', detail: `${fetched.length}개 파일 복사 중`, pct: 90 });
          const rootFs = '/home/web_user/animation_studio';
          for (const item of fetched) {
            engine.copyToFS(`${rootFs}/${item.path}`, item.buf);
          }

          post('progress', { title: 'Animation Studio 표준 도킹 애드온 시작 중…', detail: '표준 3D 뷰포트 + 도킹 패널로 hero_arena_world.tscn을 엽니다.', pct: 96 });
          post('starting', {});
          await engine.start({
            args: ['--editor', '--path', rootFs, '--single-window', 'res://hero/arena/hero_arena_world.tscn'],
            canvas,
          });
          post('started', {});
          canvas.focus();
        } catch (err) {
          post('fatal', { message: err instanceof Error ? err.message : String(err) });
        }
      }
      boot();
    })();
  </script>
</body>
</html>
