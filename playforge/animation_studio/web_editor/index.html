<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#14181f">
  <link rel="icon" href="/vendor/favicon.png" type="image/png">
  <title>Godot Web Editor · Animation Studio Standard Addon</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#12151b;color:#e8f0f8;font:13px system-ui,-apple-system,"Malgun Gothic",sans-serif;overflow:hidden}
    #topbar{height:34px;display:flex;align-items:center;padding:0 12px;gap:10px;background:#181d26;border-bottom:1px solid #2b3344}
    #brand{font-weight:700;color:#f39c2b;letter-spacing:.3px;white-space:nowrap}
    #subtitle{color:#9eb0c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #pill{padding:2px 8px;border-radius:999px;background:#1d2b2a;border:1px solid #2cc7b8;color:#62e6d8;font-size:11px;font-weight:600;white-space:nowrap}
    #status{margin-left:auto;color:#a5b7cf;font-size:12px;white-space:nowrap}
    .top-btn{padding:3px 9px;border:1px solid #3c465a;border-radius:4px;background:#232936;color:#dce6f4;font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap}
    .top-btn:hover{background:#303849}
    #local-fork-btn{border-color:#d88a22;background:#2e2315;color:#ffd08a}
    #local-fork-btn:hover{background:#3e2f1c}
    #editor-frame{display:block;width:100%;height:calc(100% - 34px);border:0;background:#12151b}
    #loading{position:fixed;inset:34px 0 0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#13171e;padding:24px;text-align:center}
    #loading[hidden]{display:none}
    #loading-title{font-size:16px;font-weight:700;color:#edf3fa}
    #loading-bar-wrap{width:min(420px,84vw);height:8px;border-radius:999px;background:#1c222d;border:1px solid #313b4d;overflow:hidden}
    #loading-bar{width:6%;height:100%;background:linear-gradient(90deg,#2cc7b8,#f39c2b);transition:width .18s ease}
    #loading-detail{font-size:12px;color:#93a5bc;max-width:480px}
    #error-box{display:none;max-width:520px;padding:12px 14px;border:1px solid #d96b6b;border-radius:6px;background:#2a171b;color:#ffd3d3;font-size:12px;text-align:left;white-space:pre-wrap}
  </style>
</head>
<body>
  <div id="topbar">
    <span id="brand">◆ GODOT 4.7.2 WEB EDITOR</span>
    <span id="subtitle">Animation Studio · 표준 3D 뷰포트 + 도킹 패널 애드온</span>
    <span id="pill">3D Viewport · Dockable Addon</span>
    <span id="status" aria-live="polite">초기화 중…</span>
    <a id="local-fork-btn" class="top-btn" href="/launch-local-editor" target="_blank" rel="noopener" title="로컬 PC의 Forge-Refactoring-engine 포크 Godot 에디터로 hero_arena_world.tscn 바로 열기">로컬 포크 에디터 열기</a>
    <button id="reload-btn" class="top-btn" type="button" onclick="location.reload()">새로고침</button>
  </div>
  <iframe id="editor-frame" src="/editor-frame.html" title="Godot 4.7.2 Web Editor"></iframe>
  <div id="loading" role="status" aria-live="polite">
    <div id="loading-title">Godot 웹 에디터 + Animation Studio 표준 도킹 애드온 준비 중…</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div id="loading-detail">3D 아레나 씬(hero_arena_world.tscn)과 내재화 캐릭터 28종 GLB/RES 에셋을 불러오고 있습니다.</div>
    <div id="error-box"></div>
  </div>
  <script>
    (() => {
      'use strict';
      const statusEl = document.getElementById('status');
      const loadingEl = document.getElementById('loading');
      const titleEl = document.getElementById('loading-title');
      const barEl = document.getElementById('loading-bar');
      const detailEl = document.getElementById('loading-detail');
      const errorEl = document.getElementById('error-box');
      const isLocalHost = ['127.0.0.1', 'localhost', '::1'].includes(window.location.hostname);
      const localForkBtn = document.getElementById('local-fork-btn');
      if (localForkBtn && !isLocalHost) {
        localForkBtn.style.display = 'none';
      }

      window.__ANIMATION_STUDIO_WEB_STATE__ = {
        phase: 'boot',
        addonReady: false,
        errors: [],
        logs: [],
      };

      function setProgress(title, detail, pct) {
        if (title !== null && title !== undefined) titleEl.textContent = title;
        if (detail !== null && detail !== undefined) detailEl.textContent = detail;
        if (Number.isFinite(pct)) barEl.style.width = `${Math.max(4, Math.min(100, Math.round(pct)))}%`;
        statusEl.textContent = detail || title || statusEl.textContent;
      }

      window.addEventListener('message', (ev) => {
        if (ev.origin !== window.location.origin) return;
        const msg = ev.data;
        if (!msg || msg.source !== 'animation-studio-godot') return;
        const st = window.__ANIMATION_STUDIO_WEB_STATE__;
        switch (msg.type) {
          case 'progress':
            setProgress(msg.title, msg.detail, msg.pct);
            break;
          case 'log':
            st.logs.push(msg.line);
            break;
          case 'log_error':
            st.logs.push('[ERR] ' + msg.line);
            if (msg.isScriptError) st.errors.push(msg.line);
            break;
          case 'starting':
            st.phase = 'starting';
            break;
          case 'started':
            loadingEl.hidden = true;
            if (!st.addonReady) statusEl.textContent = 'Godot 웹 에디터 실행 중 (도킹 패널 초기화 중…)';
            break;
          case 'addon_ready':
            st.addonReady = true;
            st.phase = 'ready';
            loadingEl.hidden = true;
            statusEl.textContent = '표준 3D 뷰포트 + 도킹 패널(계층·상태·Animation Flow) 활성';
            break;
          case 'fatal':
            st.errors.push(msg.message);
            st.phase = 'error';
            errorEl.style.display = 'block';
            errorEl.textContent = msg.message;
            statusEl.textContent = '오류 발생';
            break;
        }
      });
    })();
  </script>
</body>
</html>
